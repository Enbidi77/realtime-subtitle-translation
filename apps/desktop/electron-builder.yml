appId: com.echolingo.desktop
productName: EchoLingo
copyright: Copyright © 2026 EchoLingo Team

directories:
  output: release/${version}
  buildResources: build

files:
  - out/**/*
  - package.json
  - resources/**/*
  - "!resources/bin/**/*"

asarUnpack:
  - "**/*.node"
  - "**/node_modules/ffmpeg-static/**"

win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
    - msi
    - appx
  artifactName: ${productName}-Setup-${version}.${ext}
  extraResources:
    - from: resources/bin
      to: bin
      filter:
        - "**/*"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

msi:
  oneClick: false
  perMachine: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: false

appx:
  applicationId: EchoLingoApp
  identityName: Enbidi.EchoLingoApp
  publisher: CN=7D350121-9482-4DA4-B852-3D95D4F0BF11
  publisherDisplayName: Enbidi
  backgroundColor: "#0B132B"
  showNameOnTiles: true
  languages:
    - en-US
    - vi-VN
  artifactName: ${productName}-${version}.${ext}

mac:
  target:
    - dmg
  category: public.app-category.productivity

linux:
  icon: build/icons
  target:
    - AppImage
    - deb
  category: AudioVideo
